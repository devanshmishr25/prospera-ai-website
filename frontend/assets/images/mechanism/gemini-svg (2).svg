<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="bgGradLeads" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#1e3a8a" />
      <stop offset="100%" stop-color="#0f172a" />
    </radialGradient>
    
    <!-- Funnel Gradient -->
    <linearGradient id="funnelGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#1d4ed8" />
    </linearGradient>

    <!-- Metallic Edge Gradient -->
    <linearGradient id="edgeGradLeads" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#60a5fa" />
      <stop offset="100%" stop-color="#1e40af" />
    </linearGradient>
  </defs>

  <!-- Outer Circular Badge Background -->
  <circle cx="256" cy="256" r="230" fill="url(#bgGradLeads)" stroke="url(#edgeGradLeads)" stroke-width="12" />

  <!-- Funnel -->
  <path d="M170 130L342 130L300 220V320L212 320V220L170 130Z" fill="url(#funnelGrad)" stroke="#93c5fd" stroke-width="4" stroke-linejoin="round"/>
  <rect x="202" y="100" width="108" height="30" rx="15" fill="#1e40af" stroke="#93c5fd" stroke-width="4"/>
  <rect x="240" y="320" width="32" height="90" fill="#1d4ed8"/>

  <!-- User Profiles (Leads) -->
  <!-- Lead 1 (Top) -->
  <g transform="translate(220, 155) scale(0.8)">
    <circle cx="40" cy="15" r="15" fill="#ffffff"/>
    <path d="M40 35C25 35 10 50 10 65H70C70 50 55 35 40 35Z" fill="#ffffff"/>
  </g>
  <!-- Lead 2 (Middle) -->
  <g transform="translate(270, 180) scale(0.7)">
    <circle cx="40" cy="15" r="15" fill="#e0f2fe"/>
    <path d="M40 35C25 35 10 50 10 65H70C70 50 55 35 40 35Z" fill="#e0f2fe"/>
  </g>
  <!-- Lead 3 (Lower, near spout) -->
  <g transform="translate(210, 210) scale(0.6)">
    <circle cx="40" cy="15" r="15" fill="#bfdbfe"/>
    <path d="M40 35C25 35 10 50 10 65H70C70 50 55 35 40 35Z" fill="#bfdbfe"/>
  </g>

  <!-- Magnet -->
  <path d="M380 240C380 200 340 180 300 210C330 240 370 230 360 260C340 290 300 280 300 320C340 350 380 330 380 290" fill="none" stroke="#ef4444" stroke-width="12" stroke-linecap="round"/>
  <!-- Magnet Poles -->
  <rect x="365" y="250" width="30" height="20" fill="#ef4444"/>
  <rect x="365" y="280" width="30" height="20" fill="#ffffff"/>
</svg>
