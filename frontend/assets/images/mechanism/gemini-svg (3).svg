<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="bgGradVoice" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#1e3a8a" />
      <stop offset="100%" stop-color="#0f172a" />
    </radialGradient>
    
    <!-- Ear Gradient -->
    <linearGradient id="earGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#60a5fa" />
      <stop offset="100%" stop-color="#1d4ed8" />
    </linearGradient>

    <!-- Metallic Edge Gradient -->
    <linearGradient id="edgeGradVoice" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#60a5fa" />
      <stop offset="100%" stop-color="#1e40af" />
    </linearGradient>
    
    <!-- Sound Wave Color -->
    <linearGradient id="waveGrad" x1="0%" y1="0%" x2="100%" y2="0%">
        <stop offset="0%" stop-color="#93c5fd" />
        <stop offset="50%" stop-color="#ffffff" />
        <stop offset="100%" stop-color="#93c5fd" />
    </linearGradient>
  </defs>

  <!-- Outer Circular Badge Background -->
  <circle cx="256" cy="256" r="230" fill="url(#bgGradVoice)" stroke="url(#edgeGradVoice)" stroke-width="12" />

  <!-- Ear Icon -->
  <path d="M180 150C140 150 110 180 110 256C110 332 140 362 180 362C200 362 215 345 215 325V200C215 170 198 150 180 150Z" fill="url(#earGrad)" stroke="#93c5fd" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  
  <!-- Inner Ear Details -->
  <path d="M160 210C150 210 140 220 140 235V280C140 295 150 305 160 305" fill="none" stroke="#bfdbfe" stroke-width="4" stroke-linecap="round"/>
  <path d="M190 200C175 200 160 215 160 256C160 297 175 312 190 312" fill="none" stroke="#bfdbfe" stroke-width="4" stroke-linecap="round"/>

  <!-- AI Sound Waves -->
  <path d="M250 180L250 332" fill="none" stroke="url(#waveGrad)" stroke-width="10" stroke-linecap="round"/>
  <path d="M280 210L280 302" fill="none" stroke="url(#waveGrad)" stroke-width="10" stroke-linecap="round"/>
  <path d="M310 230L310 282" fill="none" stroke="url(#waveGrad)" stroke-width="10" stroke-linecap="round"/>
  <path d="M220 210L220 302" fill="none" stroke="url(#waveGrad)" stroke-width="10" stroke-linecap="round"/>
  <path d="M190 230L190 282" fill="none" stroke="url(#waveGrad)" stroke-width="10" stroke-linecap="round"/>

  <!-- Headset element integrated -->
  <path d="M195 340C180 340 160 355 160 375V390H210V375C210 355 190 340 195 340Z" fill="#1e40af" stroke="#93c5fd" stroke-width="3"/>
  <circle cx="190" cy="380" r="8" fill="#60a5fa"/>
  
</svg>
