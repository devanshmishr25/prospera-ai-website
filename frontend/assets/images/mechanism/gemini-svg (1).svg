<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="bgGradPerf" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#1e3a8a" />
      <stop offset="100%" stop-color="#0f172a" />
    </radialGradient>
    
    <!-- Rocket Body Gradient -->
    <linearGradient id="rocketGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#60a5fa" />
      <stop offset="100%" stop-color="#1d4ed8" />
    </linearGradient>

    <!-- Metallic Edge Gradient -->
    <linearGradient id="edgeGradPerf" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#60a5fa" />
      <stop offset="100%" stop-color="#1e40af" />
    </linearGradient>
    
    <!-- Graph Line Color -->
    <linearGradient id="graphLineGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#93c5fd" />
      <stop offset="100%" stop-color="#ffffff" />
    </linearGradient>
  </defs>

  <!-- Outer Circular Badge Background -->
  <circle cx="256" cy="256" r="230" fill="url(#bgGradPerf)" stroke="url(#edgeGradPerf)" stroke-width="12" />

  <!-- Bar Graph (Background Elements) -->
  <!-- Bar 1 -->
  <rect x="110" y="290" width="50" height="120" rx="10" fill="#1e40af" />
  <!-- Bar 2 -->
  <rect x="170" y="260" width="50" height="150" rx="10" fill="#1e40af" />
  <!-- Bar 3 (Rocket's path) -->
  <rect x="230" y="200" width="50" height="210" rx="10" fill="#2563eb" opacity="0.6" />
  <!-- Bar 4 (Highest) -->
  <rect x="290" y="150" width="50" height="260" rx="10" fill="#3b82f6" />
  <!-- Bar 5 -->
  <rect x="350" y="220" width="50" height="190" rx="10" fill="#2563eb" />

  <!-- Rocket -->
  <path d="M270 140L310 190C315 195 325 198 330 195L400 160C415 152 410 130 395 135L325 160C320 162 310 160 305 155L270 140Z" fill="url(#rocketGrad)" stroke="#93c5fd" stroke-width="2"/>
  <!-- Rocket Fin -->
  <path d="M280 180L300 210L275 205Z" fill="#1d4ed8" stroke="#93c5fd" stroke-width="1"/>
  <!-- Rocket Flame -->
  <path d="M260 180L245 200L260 220L250 200Z" fill="#facc15" opacity="0.9"/>

  <!-- Performance Line Graph on top of bars -->
  <path d="M135 300 L195 270 L255 210 L315 160 L375 230" fill="none" stroke="url(#graphLineGrad)" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
  
  <!-- Data Points on line -->
  <circle cx="135" cy="300" r="8" fill="#ffffff"/>
  <circle cx="195" cy="270" r="8" fill="#ffffff"/>
  <circle cx="255" cy="210" r="10" fill="#ffffff" stroke="#3b82f6" stroke-width="4"/> <!-- Key Point -->
  <circle cx="315" cy="160" r="8" fill="#ffffff"/>
  <circle cx="375" cy="230" r="8" fill="#ffffff"/>
</svg>
