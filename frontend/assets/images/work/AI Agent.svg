<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="bgAgent" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#1e3a8a" />
      <stop offset="100%" stop-color="#0f172a" />
    </radialGradient>
    
    <!-- Solid/Gradient Blue Circle -->
    <linearGradient id="blueGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#1d4ed8" />
    </linearGradient>

    <!-- Metallic Edge Gradient -->
    <linearGradient id="edgeAgent" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#60a5fa" />
      <stop offset="100%" stop-color="#1e40af" />
    </linearGradient>
  </defs>

  <!-- Outer Circular Badge Background -->
  <circle cx="256" cy="256" r="230" fill="url(#bgAgent)" stroke="url(#edgeAgent)" stroke-width="12" />

  <!-- Solid Blue Circle Badge Container (matching reference image) -->
  <circle cx="256" cy="256" r="140" fill="url(#blueGrad)" stroke="#60a5fa" stroke-width="4" />

  <!-- AI Robot Bot Icon (matching the minimal robot head in reference) -->
  <g transform="translate(196, 196) scale(1.5)">
    <!-- Antenna -->
    <line x1="40" y1="5" x2="40" y2="15" stroke="#ffffff" stroke-width="4" stroke-linecap="round"/>
    <circle cx="40" cy="2" r="4" fill="#ffffff"/>
    
    <!-- Robot Head Box -->
    <rect x="15" y="15" width="50" height="40" rx="10" fill="none" stroke="#ffffff" stroke-width="5"/>
    
    <!-- Eyes -->
    <circle cx="30" cy="32" r="5" fill="#ffffff"/>
    <circle cx="50" cy="32" r="5" fill="#ffffff"/>
    
    <!-- Mouth / Smile Line -->
    <path d="M30 43C33 47 47 47 50 43" fill="none" stroke="#ffffff" stroke-width="4" stroke-linecap="round"/>
    
    <!-- Ear / Bolts on sides -->
    <line x1="10" y1="28" x2="15" y2="28" stroke="#ffffff" stroke-width="4" stroke-linecap="round"/>
    <line x1="65" y1="28" x2="70" y2="28" stroke="#ffffff" stroke-width="4" stroke-linecap="round"/>
  </g>
</svg>
